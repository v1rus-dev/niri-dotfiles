# kitty — Tokyo Night
# Второй терминал рядом с alacritty (основной — alacritty, Mod+T).
# Запуск: `kitty`. Палитра синхронизирована 1:1 с ~/.config/alacritty/alacritty.toml.
# Docs: https://sw.kovidgoyal.net/kitty/conf/

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

# --- Window ---
background_opacity   0.92
window_padding_width 12
# Прозрачность действует всегда, в т.ч. в фокусе. Блюр за окном включается
# правилом `background-effect { blur true }` в ~/.config/niri/config.kdl
# (app-id="^kitty$"), kitty его сам не запрашивает.
confirm_os_window_close 0
enable_audio_bell    no

# --- Tokyo Night colors ---
foreground #c0caf5
background #1a1b26

selection_foreground #c0caf5
selection_background  #283457

cursor            #c0caf5
cursor_text_color #1a1b26

# normal
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# bright
color8  #414868
color9  #ff9e64
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
