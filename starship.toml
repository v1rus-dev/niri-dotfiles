add_newline = true

format = """
[](surface0)\
$os$username\
[](bg:peach fg:surface0)\
$directory\
[](fg:peach bg:green)\
$git_branch$git_status\
[](fg:green bg:blue)\
$kotlin$java$nodejs$rust\
[](fg:blue bg:surface0)\
$cmd_duration\
[ ](fg:surface0)\
$line_break$character"""

palette = "tokyonight"

# Tokyo Night. Имена ролей сохранены (peach = оранжевый акцент директории и т.д.),
# чтобы модули ниже не трогать; значения — из палитры Tokyo Night.
[palettes.tokyonight]
surface0 = "#292e42"   # bg-highlight — тёмные сегменты (os/username/cmd_duration)
peach    = "#ff9e64"   # orange — directory
green    = "#9ece6a"   # green — git
blue     = "#7aa2f7"   # blue — языки
red      = "#f7768e"   # red — ошибка
text     = "#1a1b26"   # bg — тёмный текст поверх цветных сегментов

[os]
disabled = false
style = "bg:surface0 fg:text"
[os.symbols]
Arch = "󰣇 "

[username]
show_always = true
style_user = "bg:surface0 fg:text"
format = '[ $user ]($style)'

[directory]
style = "bg:peach fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:green fg:text"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:green fg:text"
format = '[$all_status$ahead_behind ]($style)'

[kotlin]
symbol = ""
style = "bg:blue fg:text"
format = '[ $symbol $version ]($style)'

[java]
symbol = ""
style = "bg:blue fg:text"
format = '[ $symbol $version ]($style)'

[nodejs]
symbol = ""
style = "bg:blue fg:text"
format = '[ $symbol $version ]($style)'

[rust]
symbol = ""
style = "bg:blue fg:text"
format = '[ $symbol $version ]($style)'

[cmd_duration]
min_time = 500
style = "bg:surface0 fg:text"
format = '[ 󱦟 $duration ]($style)'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
